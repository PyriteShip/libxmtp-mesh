[package]
name = "xmtp_mesh"
edition = "2024"
license.workspace = true
version.workspace = true
description = "Serverless XMTP v3 node emulation, synced peer-to-peer (xmtp-mesh)"

[lints]
workspace = true

[features]
# Test-only hooks (`*_for_test`, `LoopbackHub::inject`); never enable in production.
test-utils = []

[dependencies]
aes-gcm = { workspace = true }
alloy.workspace = true
async-trait.workspace = true
bytes.workspace = true
diesel = { workspace = true, features = ["sqlite"] }
diesel_migrations = { workspace = true, features = ["sqlite"] }
futures = { workspace = true, features = ["std"] }
hex.workspace = true
hkdf = { workspace = true }
hmac = "0.12.1"
http = "1.2"
libsqlite3-sys = { version = "0.35", features = ["bundled-sqlcipher-vendored-openssl"] }
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
parking_lot.workspace = true
prost = { workspace = true, features = ["derive", "std"] }
rand = { workspace = true }
sha2.workspace = true
# Noise links (DESIGN.md §B14). No `std`/default features: snow's `std`
# feature pulls in its optional `ring` and `blake2` dependencies.
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tonic = { workspace = true }
tracing.workspace = true
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xmtp-workspace-hack = { version = "0.1", path = "../xmtp-workspace-hack" }
xmtp_api_grpc.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_id.workspace = true
xmtp_mls.workspace = true
xmtp_proto.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The integration tests use the crate's test-only hooks.
xmtp_mesh = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }
xmtp_api_d14n = { workspace = true }
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_cryptography.workspace = true
xmtp_db = { workspace = true }
xmtp_id = { workspace = true, features = ["test-utils"] }
xmtp_mls = { workspace = true, features = ["test-utils"] }

[[test]]
name = "capture_commit"
path = "tests/fixtures/capture_commit.rs"
